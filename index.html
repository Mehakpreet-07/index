<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#141313">
<meta name="description" content=" Website is coming soon.">
<title>Coming Soon</title>
<style>
:root{color-scheme:dark;--gold:#dcb879;--white:#f5f3f0}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;width:100%}
body{font-family:Arial,Helvetica,sans-serif;background:#141313;color:var(--white);overflow-x:hidden}
main{position:relative;isolation:isolate;display:grid;place-items:center;min-height:100vh;min-height:100svh;padding:40px 22px;overflow:hidden;background:radial-gradient(ellipse at 0% 0%,rgba(176,111,50,.31),transparent 38%),radial-gradient(ellipse at 100% 85%,rgba(149,89,37,.27),transparent 40%),linear-gradient(130deg,#201b18 0%,#111213 48%,#1d1815 100%)}
main:before,main:after{content:"";position:absolute;z-index:-1;pointer-events:none;width:110vw;height:35vw;min-height:190px;border:1px solid rgba(219,167,91,.45);border-radius:50%;transform:rotate(21deg);box-shadow:0 -1px 17px rgba(230,164,74,.08)}
main:before{left:-53vw;bottom:-12vw}
main:after{right:-58vw;top:-18vw;transform:rotate(-19deg)}
.content{text-align:center;position:relative;z-index:1;width:100%;max-width:850px}
h1{font-size:clamp(28px,4.3vw,62px);line-height:1.2;letter-spacing:-.035em;font-weight:400;margin:0}
h1 span{display:block;color:var(--gold);font-weight:500;margin-top:.08em}
.line{height:2px;width:118px;margin:36px auto 0;position:relative;background:linear-gradient(90deg,transparent,#b98543 20%,#f8d9a1 50%,#b98543 80%,transparent);box-shadow:0 0 10px rgba(245,185,93,.32)}
.line:after{content:"";position:absolute;width:8px;height:8px;left:calc(50% - 4px);top:-3px;border-radius:50%;background:#fff4d8;box-shadow:0 0 8px 3px #eebd6d,0 0 22px 6px rgba(231,174,86,.45);animation:glimmer 3.8s ease-in-out infinite}
@keyframes glimmer{0%,100%{opacity:.55;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}
@media(max-width:600px){main{padding:30px 18px;background:radial-gradient(ellipse at 0% 0%,rgba(176,111,50,.25),transparent 45%),radial-gradient(ellipse at 100% 100%,rgba(149,89,37,.22),transparent 50%),#141313}h1{font-size:clamp(30px,8vw,43px)}.line{margin-top:28px;width:94px}main:before{left:-75vw;bottom:2vh}main:after{right:-75vw;top:3vh}}
@media(prefers-reduced-motion:reduce){.line:after{animation:none}}
</style>
</head>
<body><main><div class="content"><h1>Website Is<span>Coming Soon.</span></h1><div class="line" aria-hidden="true"></div></div></main></body>
</html>
